<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0f1e">
  <title>Chantier Orbital — construis ta station spatiale</title>
  <link rel="stylesheet" href="css/style.css?v=24">
</head>
<body>
  <div id="app">
    <canvas id="game" tabindex="0"></canvas>
    <canvas id="minimap" data-tip="Carte|Clique ou glisse pour déplacer la caméra|M pour masquer"></canvas>

    <header id="topbar">
      <div class="brand"><span class="logo"></span><b>Chantier Orbital</b></div>
      <div class="chip" id="money" data-tip="Crédits|Gagnés en vendant au Comptoir ou au Port, et à chaque étape de la station"><span class="coin"></span><b id="money-val">0</b><small id="money-rate"></small></div>
      <div class="chip" id="workers" data-tip="Ouvriers|Au travail / dans l’équipe|Chaque bâtiment posé attend qu’un ouvrier vienne le construire|Recrute-en d’autres dans l’onglet Station"><span class="wk-ico"></span><b id="workers-val">0/3</b><small id="workers-wait"></small></div>
      <div class="chip" id="power" data-tip="Énergie|Production / demande de tous les réseaux électriques|Une machine sans courant s’arrête ; un réseau trop chargé ralentit toutes ses machines|Pose des poteaux et des générateurs (catégorie Énergie)"><span class="pw-ico">⚡</span><b id="power-val">0/0 kW</b><small id="power-warn"></small></div>
      <div class="chip grow" id="station-chip" data-tip="Station|Progression de l’étape en cours (onglet Station pour le détail)">
        <span id="phase-label"></span>
        <div class="bar"><i id="phase-bar"></i></div>
      </div>
      <button id="btn-map" class="ibtn" data-tip="Minicarte|Afficher / masquer la carte en haut à droite (M)">▦</button>
      <button id="btn-panel" class="ibtn" data-tip="Panneau latéral|Afficher / masquer Station, Recherche, Production, Infos">▤</button>
      <button id="btn-menu" class="ibtn" data-tip="Menu|Recettes, aide, export / import, nouvelle partie">☰</button>
      <div id="menu" hidden></div>
    </header>

    <nav id="palette" aria-label="Bâtiments"></nav>
    <aside id="side"><div id="tabs"></div><div id="tabbody"></div></aside>

    <div id="bottom">
      <div id="hint"></div>
      <div id="toolbar"></div>
      <div id="status"></div>
    </div>

    <div id="toasts"></div>
    <div id="modal" hidden></div>
  </div>
  <input type="file" id="file-import" accept=".json,application/json" hidden>

  <script src="js/util.js?v=24"></script>
  <script src="js/config.js?v=24"></script>
  <script src="js/changelog.js?v=24"></script>
  <script src="js/world.js?v=24"></script>
  <script src="js/state.js?v=24"></script>
  <script src="js/sim.js?v=24"></script>
  <script src="js/power.js?v=24"></script>
  <script src="js/fluid.js?v=24"></script>
  <script src="js/tubes.js?v=24"></script>
  <script src="js/contracts.js?v=24"></script>
  <script src="js/drones.js?v=24"></script>
  <script src="js/orbit.js?v=24"></script>
  <script src="js/history.js?v=24"></script>
  <script src="js/plans.js?v=24"></script>
  <script src="js/sprites.js?v=24"></script>
  <script src="js/voxel.js?v=24"></script>
  <script src="js/station.js?v=24"></script>
  <script src="js/render.js?v=24"></script>
  <script src="js/iso.js?v=24"></script>
  <script src="js/minimap.js?v=24"></script>
  <script src="js/input.js?v=24"></script>
  <script src="js/ui.js?v=24"></script>
  <script src="js/main.js?v=24"></script>
</body>
</html>
